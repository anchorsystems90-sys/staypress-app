[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/images"
  to = "/images-to-pdf"
  status = 301

[[redirects]]
  from = "/compress"
  to = "/slim"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
