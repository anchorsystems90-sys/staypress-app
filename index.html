<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta name="color-scheme" content="light" />

    <title>Staypress — Private PDF tools (no upload)</title>
    <meta
      name="description"
      content="Staypress: private PDF tools in your browser. Images to PDF, merge, extract, and slim — files never leave your device."
    />
    <meta name="application-name" content="Staypress" />
    <meta name="author" content="Staypress" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Staypress" />
    <meta property="og:title" content="Staypress — Private PDF tools" />
    <meta
      property="og:description"
      content="Drop images. Get a PDF. Merge, extract, and slim — everything stays on your device."
    />
    <meta property="og:image" content="/og.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Staypress — Private PDF tools" />
    <meta
      name="twitter:description"
      content="Drop images. Get a PDF. Merge, extract, and slim — everything stays on your device."
    />
    <meta name="twitter:image" content="/og.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      After you have a public URL, replace YOUR_DOMAIN and uncomment:
      <link rel="canonical" href="https://YOUR_DOMAIN/" />
      <meta property="og:url" content="https://YOUR_DOMAIN/" />
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
