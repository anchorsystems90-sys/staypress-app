<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta name="color-scheme" content="light" />

    <title>Images to PDF — Private, no upload | Bento Tools</title>
    <meta
      name="description"
      content="Convert JPG, PNG, WebP, GIF, and HEIC to PDF in your browser. Free, no account, and files never leave your device."
    />
    <meta name="application-name" content="Bento Tools" />
    <meta name="author" content="Bento Tools" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bento Tools" />
    <meta property="og:title" content="Images to PDF — private, no upload" />
    <meta
      property="og:description"
      content="Drop photos and get a PDF. Bento Tools runs entirely on your device — nothing is uploaded."
    />
    <!-- Absolute og:image / twitter:image when VITE_SITE_URL is set at build -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bento Tools — useful browser tools. No signup. Files stay on your device where the tool runs locally."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Images to PDF — private, no upload" />
    <meta
      name="twitter:description"
      content="Drop photos and get a PDF. Bento Tools runs entirely on your device — nothing is uploaded."
    />
    <meta name="twitter:image" content="/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
