<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9EEF2"/>
      <stop offset="0.45" stop-color="#DFE7ED"/>
      <stop offset="1" stop-color="#D2DDE5"/>
    </linearGradient>
    <linearGradient id="accent" x1="760" y1="120" x2="1080" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C7D89"/>
      <stop offset="1" stop-color="#12B3C0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 90) rotate(90) scale(340 420)">
      <stop stop-color="#12B3C0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#12B3C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1040" cy="480" r="260" fill="#0C7D89" fill-opacity="0.08"/>

  <!-- stacked sheets -->
  <g transform="translate(780 150)">
    <rect x="36" y="28" width="220" height="300" rx="18" fill="#C9D5DE" opacity="0.55"/>
    <rect x="18" y="14" width="220" height="300" rx="18" fill="#E8EEF3"/>
    <rect width="220" height="300" rx="18" fill="#F9FBFD" stroke="#0D141B" stroke-opacity="0.08"/>
    <rect x="28" y="48" width="140" height="10" rx="5" fill="#0C7D89" opacity="0.85"/>
    <rect x="28" y="78" width="164" height="8" rx="4" fill="#0D141B" opacity="0.12"/>
    <rect x="28" y="98" width="148" height="8" rx="4" fill="#0D141B" opacity="0.1"/>
    <rect x="28" y="118" width="120" height="8" rx="4" fill="#0D141B" opacity="0.08"/>
    <rect x="28" y="160" width="164" height="8" rx="4" fill="#0D141B" opacity="0.1"/>
    <rect x="28" y="180" width="132" height="8" rx="4" fill="#0D141B" opacity="0.08"/>
    <rect x="0" y="0" width="8" height="300" rx="4" fill="url(#accent)"/>
  </g>

  <!-- brand mark -->
  <rect x="88" y="168" width="64" height="64" rx="16" fill="#0D141B"/>
  <text x="120" y="214" text-anchor="middle" fill="#12B3C0" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="800">S</text>

  <text x="168" y="214" fill="#0D141B" font-family="Georgia, 'Source Serif 4', serif" font-size="56" font-weight="600">Staypress</text>

  <text x="88" y="290" fill="#0D141B" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="600">Private PDF tools in your browser</text>
  <text x="88" y="348" fill="#55656F" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="500">No account. No upload. Files stay on this device.</text>

  <rect x="88" y="400" width="18" height="18" rx="4" fill="#0C7D89"/>
  <text x="118" y="415" fill="#2C3A45" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600">Images ? PDF · Merge · Extract · Slim</text>
</svg>
